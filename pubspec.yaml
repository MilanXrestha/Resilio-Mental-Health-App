name: Resilio
description: Mental wellness application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:

  # Flutter SDK
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Esewa SDK (local package)
  esewa_flutter_sdk:
    path: ./esewa_flutter_sdk

  # Localization
  intl: ^0.20.2

  # UI & Design
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.1.0
  google_fonts: ^8.0.2
  lottie: ^3.3.1
  flutter_animate: ^4.5.0
  dotted_border: ^3.1.0
  font_awesome_flutter: ^10.7.0
  hugeicons: ^1.1.5
  shimmer: ^3.0.0
  flip_card: ^0.7.0
  carousel_slider: ^5.1.1
  animate_do: ^4.2.0
  flutter_staggered_grid_view: ^0.7.0
  fl_chart: ^1.0.0

  # State Management (Clean Architecture + Bloc)
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  rxdart: ^0.28.0

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^2.7.1+4

  # Routing
  go_router: ^17.1.0

  # Networking
  dio: ^5.9.1
  http: ^1.5.0
  internet_connection_checker: ^3.0.1
  connectivity_plus: ^6.1.4

  # Firebase Core Stack
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  firebase_messaging: ^16.1.1
  cloud_firestore: ^6.1.2
  cloud_functions: ^6.0.6

  # Authentication Providers
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.1

  # Deep Linking
  app_links: ^6.4.0

  # Data & Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  protobuf: ^6.0.0
  fixnum: ^1.1.1
  collection: ^1.18.0

  # Storage & Local Persistence
  permission_handler: ^11.0.1
  path_provider: ^2.1.1
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3
  flutter_cache_manager: ^3.4.1
  synchronized: ^3.4.0

  # Media & Files
  video_thumbnail: ^0.5.3
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  crop_image: ^1.0.16
  file_picker: ^10.3.1
  cloudinary_public: ^0.23.1
  just_audio: ^0.10.4
  better_player_plus: ^1.0.8
  video_player: ^2.8.0
  chewie: ^1.7.0
  flutter_tts: ^4.2.5

  # Notifications
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1

  # Permissions

  # Utilities
  dartz: ^0.10.1
  share_plus: ^12.0.1
  url_launcher: ^6.3.0
  package_info_plus: ^9.0.0
  device_info_plus: ^12.3.0
  uuid: ^4.5.1
  timeago: ^3.7.1
  flag: ^7.0.2
  smooth_page_indicator: ^2.0.1
  pretty_dio_logger: ^1.3.1
  audioplayers: ^6.6.0
  table_calendar: ^3.2.0
  flutter_webrtc: ^1.4.1
  socket_io_client: ^3.1.4


dev_dependencies:

  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.11.1
  injectable_generator: ^2.12.0
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  protoc_plugin: ^25.0.0

  # App Icon & Splash Generator
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

  # Testing
  mockito: ^5.4.4

dependency_overrides:
  supertokens_flutter:
    git:
      url: https://github.com/supertokens/supertokens-flutter
      ref: master

flutter:
  uses-material-design: true
  generate: true

  # App Assets
  assets:
    - assets/icons/
    - assets/icons/png/
    - assets/icons/svg/
    - assets/animations/
    - assets/audio/
    - assets/fonts/

  # Custom Fonts
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Italic.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
