<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resilio — Work Breakdown Structure</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Inter',Arial,sans-serif;
    background:#1e1e2e;
    min-height:100vh;
    display:flex; flex-direction:column;
    align-items:center; padding:20px; gap:12px;
  }
  .btn {
    padding:7px 18px; background:#3b82f6; color:#fff;
    border:none; border-radius:5px; cursor:pointer;
    font-family:inherit; font-size:12px; font-weight:500;
  }
  .btn:hover { background:#2563eb; }
  canvas { display:block; box-shadow:0 4px 32px rgba(0,0,0,.5); }
</style>
</head>
<body>
<button class="btn" onclick="dl()">⬇ Download PNG (A4 Landscape)</button>
<canvas id="wbs"></canvas>

<script>
/* ═══════════════════════════════════════════════════
   RESILIO — WBS  (A4 Landscape, 2-level tree)
   Canvas: 1654 × 1169 px  (~141 DPI for A4)
   Structure: Root → 4 Phases → Task Groups
   ═══════════════════════════════════════════════════ */

const cv  = document.getElementById('wbs');
const ctx = cv.getContext('2d');

// A4 landscape at 141 DPI
const CW = 1654, CH = 1169;
cv.width = CW; cv.height = CH;
cv.style.width  = '827px';   // show at half size on screen
cv.style.height = '585px';

// roundRect polyfill
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    const [tl,tr,br,bl] = Array.isArray(r)?r:[r,r,r,r];
    this.beginPath();
    this.moveTo(x+tl,y); this.lineTo(x+w-tr,y);
    this.arcTo(x+w,y,x+w,y+tr,tr); this.lineTo(x+w,y+h-br);
    this.arcTo(x+w,y+h,x+w-br,y+h,br); this.lineTo(x+bl,y+h);
    this.arcTo(x,y+h,x,y+h-bl,bl); this.lineTo(x,y+tl);
    this.arcTo(x,y,x+tl,y,tl); this.closePath();
  };
}

/* ─── Palette ─── */
const COL = {
  P1: { bg:'#15803d', bd:'#4ade80', lt:'#f0fdf4', ltbd:'#86efac', tx:'#fff' },
  P2: { bg:'#1d4ed8', bd:'#60a5fa', lt:'#eff6ff', ltbd:'#93c5fd', tx:'#fff' },
  P3: { bg:'#b45309', bd:'#fbbf24', lt:'#fffbeb', ltbd:'#fcd34d', tx:'#fff' },
  P4: { bg:'#7e22ce', bd:'#c084fc', lt:'#faf5ff', ltbd:'#d8b4fe', tx:'#fff' },
};

/* ─── Data ─── */
const DATA = [
  { id:'P1', col:COL.P1, lbl:'1. Inception', sub:'Nov 2024',
    items:['1.1 Business Modeling','1.2 Initial Requirements','1.3 Risk Assessment','1.4 Environment Setup'] },
  { id:'P2', col:COL.P2, lbl:'2. Elaboration', sub:'Dec 2024',
    items:['2.1 Reqs Refinement','2.2 System Architecture','2.3 UI/UX Design','2.4 Prototypes & Planning'] },
  { id:'P3', col:COL.P3, lbl:'3. Construction', sub:'Jan – Mar 2025',
    items:['3.1 Core Foundation','3.2 Content Module','3.3 Offline Support',
           '3.4 Therapist Module','3.5 Wellness Games','3.6 Payments & Notifs','3.7 Admin Dashboard'] },
  { id:'P4', col:COL.P4, lbl:'4. Transition', sub:'Mar – Apr 2025',
    items:['4.1 Quality Assurance','4.2 UAT & Deployment','4.3 Documentation'] },
];

/* ─── Layout ─── */
const PAD = 30;
const TH  = 56;   // title bar
const FH  = 28;   // footer
const CONTENT_H = CH - TH - FH;

// Root box
const RW = 140, RH = 50;
const RPAD = 28;   // gap below root to phase row

// Phase box
const PH_H = 46;
const PH_GAP = 18;   // horizontal gap between phases

// Item boxes
const IT_H = 34;
const IT_GAP_V = 6;     // vertical gap between items
const IT_PAD = 10;      // inner left/right padding in phase column

// Vertical positions
const ROOT_Y  = TH + PAD;
const PHASE_Y = ROOT_Y + RH + RPAD;
const ITEMS_Y = PHASE_Y + PH_H + 32;

// Compute phase column widths based on item count
const MAX_ITEMS = Math.max(...DATA.map(d=>d.items.length));
const TOTAL_IT_H = ph => ph.items.length * IT_H + (ph.items.length-1)*IT_GAP_V;

// Distribute width evenly — equal columns
const INNER_W = CW - PAD*2;
const N = DATA.length;
const PH_W = (INNER_W - PH_GAP*(N-1)) / N;

// Assign X centers
DATA.forEach((ph, i) => {
  ph._x = PAD + i * (PH_W + PH_GAP);   // left x of column
  ph._cx = ph._x + PH_W/2;
});

const rootCX = CW/2;

/* ────────────────────────────────────
   DRAW
   ──────────────────────────────────── */

// Background
ctx.fillStyle = '#ffffff';
ctx.fillRect(0, 0, CW, CH);

// Subtle dot grid
ctx.fillStyle = '#e8edf3';
for (let x=PAD; x<CW-PAD; x+=16)
  for (let y=TH; y<CH-FH; y+=16)
    ctx.fillRect(x, y, 1.5, 1.5);

// ── Title bar ──
const tg = ctx.createLinearGradient(0,0,CW,0);
tg.addColorStop(0,'#0f172a'); tg.addColorStop(1,'#1e3a5f');
ctx.fillStyle=tg; ctx.fillRect(0,0,CW,TH);

ctx.fillStyle='#fff'; ctx.font='bold 20px Inter,Arial';
ctx.textAlign='left'; ctx.textBaseline='middle';
ctx.fillText('Work Breakdown Structure (WBS) — Resilio Mental Health & Wellness App', 22, TH/2-7);
ctx.font='10.5px Inter,Arial'; ctx.fillStyle='#94a3b8';
ctx.fillText('RUP Methodology  ·  4 Phases  ·  Milan Shrestha  /  23057135  /  Islington College / London Metropolitan University', 22, TH/2+10);

// Legend in title
const legs=[{lb:'Inception',col:COL.P1.bd},{lb:'Elaboration',col:COL.P2.bd},{lb:'Construction',col:COL.P3.bd},{lb:'Transition',col:COL.P4.bd}];
let lx=CW-16;
ctx.font='10px Inter,Arial'; ctx.textBaseline='middle';
for(let i=legs.length-1;i>=0;i--){
  const tw=ctx.measureText(legs[i].lb).width;
  lx-=(tw+20);
  ctx.fillStyle='#cbd5e1'; ctx.textAlign='left';
  ctx.fillText(legs[i].lb, lx+14, TH/2);
  ctx.fillStyle=legs[i].col;
  ctx.beginPath(); ctx.roundRect(lx, TH/2-5, 10, 10, 2); ctx.fill();
}

/* ── Helper: shadow ── */
function shd(on){ ctx.shadowColor=on?'rgba(0,0,0,.12)':'transparent'; ctx.shadowBlur=on?6:0; ctx.shadowOffsetY=on?2:0; }
function noShd(){ shd(false); }

/* ── Helper: box + multiline text ── */
function drawBox(x,y,w,h,r,fill,bdCol,lw){ shd(true); ctx.fillStyle=fill; ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.fill(); noShd(); ctx.strokeStyle=bdCol; ctx.lineWidth=lw; ctx.beginPath(); ctx.roundRect(x,y,w,h,r); ctx.stroke(); }
function drawText(text,cx,cy,font,col){ noShd(); ctx.font=font; ctx.fillStyle=col; ctx.textAlign='center'; ctx.textBaseline='middle'; const lines=text.split('\n'); const lh=parseInt(font)*1.3; lines.forEach((l,i)=>ctx.fillText(l,cx,cy+(i-(lines.length-1)/2)*lh)); }

/* ── Connector lines (light gray) ── */
ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1.3; ctx.setLineDash([]);

// Root → horizontal bar at midpoint
const stemY1 = ROOT_Y + RH;
const stemMid = stemY1 + RPAD*0.48;
// vertical from root down to mid
ctx.beginPath(); ctx.moveTo(rootCX, stemY1); ctx.lineTo(rootCX, stemMid); ctx.stroke();
// horizontal bar across all phase centres
ctx.beginPath(); ctx.moveTo(DATA[0]._cx, stemMid); ctx.lineTo(DATA[DATA.length-1]._cx, stemMid); ctx.stroke();
// drop from bar to each phase
DATA.forEach(ph => {
  ctx.beginPath(); ctx.moveTo(ph._cx, stemMid); ctx.lineTo(ph._cx, PHASE_Y); ctx.stroke();
});

// Phase → items
DATA.forEach(ph => {
  const phBotY = PHASE_Y + PH_H;
  const itStemMid = phBotY + 16;
  ctx.beginPath(); ctx.moveTo(ph._cx, phBotY); ctx.lineTo(ph._cx, itStemMid); ctx.stroke();
  // vertical bar from first to last item
  const firstItemY = ITEMS_Y + IT_H/2;
  const lastItemY  = ITEMS_Y + (ph.items.length-1)*(IT_H+IT_GAP_V) + IT_H/2;
  ctx.beginPath(); ctx.moveTo(ph._cx, itStemMid); ctx.lineTo(ph._cx, lastItemY+2); ctx.stroke();
  // horizontal tick to each item
  ph.items.forEach((_, idx) => {
    const iy = ITEMS_Y + idx*(IT_H+IT_GAP_V) + IT_H/2;
    ctx.beginPath(); ctx.moveTo(ph._cx, iy); ctx.lineTo(ph._x + IT_PAD, iy); ctx.stroke();
  });
});

/* ── Root node ── */
drawBox(rootCX-RW/2, ROOT_Y, RW, RH, 8, '#0f172a', '#334155', 2);
drawText('Resilio\nWellness App', rootCX, ROOT_Y+RH/2, 'bold 11px Inter,Arial', '#f8fafc');

/* ── Phase columns ── */
DATA.forEach(ph => {
  const c = ph.col;
  // Phase header box (full width of column)
  drawBox(ph._x, PHASE_Y, PH_W, PH_H, 7, c.bg, c.bd, 2);
  drawText(ph.lbl, ph._cx, PHASE_Y+PH_H/2-6, 'bold 11px Inter,Arial', c.tx);
  ctx.font='9px Inter,Arial'; ctx.fillStyle=c.tx+'bb'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(ph.sub, ph._cx, PHASE_Y+PH_H/2+9);

  // Item boxes — slightly narrower than column
  const iw = PH_W - IT_PAD*2;
  ph.items.forEach((item, idx) => {
    const iy = ITEMS_Y + idx*(IT_H+IT_GAP_V);
    drawBox(ph._x + IT_PAD, iy, iw, IT_H, 5, c.lt, c.ltbd, 1.3);
    drawText(item, ph._cx, iy+IT_H/2, '9px Inter,Arial', c.bg);
  });
});

/* ── Footer ── */
ctx.fillStyle='#f1f5f9'; ctx.fillRect(0,CH-FH,CW,FH);
ctx.beginPath(); ctx.strokeStyle='#e2e8ef'; ctx.lineWidth=1;
ctx.moveTo(0,CH-FH); ctx.lineTo(CW,CH-FH); ctx.stroke();
ctx.fillStyle='#64748b'; ctx.font='9px Inter,Arial';
ctx.textAlign='left'; ctx.textBaseline='middle';
ctx.fillText('Milan Shrestha  |  23057135  |  Islington College / London Metropolitan University  |  Resilio — Mental Health & Wellness App', 18, CH-FH+14);
ctx.textAlign='right';
ctx.fillText('RUP Methodology  ·  Nov 2024 – Apr 2025', CW-18, CH-FH+14);

function dl(){
  const a=document.createElement('a');
  a.download='resilio-wbs.png'; a.href=cv.toDataURL('image/png'); a.click();
}
</script>
</body>
</html>
