      /* roundRect polyfill */
      if (!ctx.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
          this.beginPath();
          this.moveTo(x + r, y); this.lineTo(x + w - r, y);
          this.quadraticCurveTo(x + w, y, x + w, y + r); this.lineTo(x + w, y + h - r);
          this.quadraticCurveTo(x + w, y + h, x + w - r, y + h); this.lineTo(x + r, y + h);

      // Find the date range of this page
      let minDay = TOTAL_DAYS, maxDay = 0;
      rows.forEach(r => {
        const s = r.s ? daysSince(r.s) : (r.d ? daysSince(r.d) : 0);
        const e = r.e ? daysSince(r.e) : (r.d ? daysSince(r.d) : 0);
        if (s < minDay) minDay = s;
        if (e > maxDay) maxDay = e;
      });
      // Show full months that overlap this range (add padding)
      const PAGE_MONTHS = ALL_MONTHS.filter(m =>
        m.start <= maxDay + 5 && (m.start + m.days) >= minDay - 5
      );

      /* ── Pixel helpers calibrated to page date range ── */
      // We scale CHART_W to the days shown (pad a bit)
      const pageDayStart = PAGE_MONTHS[0].start;
      const lastM = PAGE_MONTHS[PAGE_MONTHS.length - 1];
      const pageDayEnd = lastM.start + lastM.days;
      const pageDays = pageDayEnd - pageDayStart;
      const PX_DAY = CHART_W / pageDays;

      function dayX(d) { return LABEL_W + (d - pageDayStart) * PX_DAY; }
      function dateX(s) { return dayX(daysSince(s)); }
      function dateXe(s) { return dayX(daysSince(s) + 1); }

      cv.width = W;
      cv.height = H;

      /* ── white base ── */
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);

      /* ── alternating row stripes ── */
      rows.forEach((_, i) => {
        const y = TITLE_H + HDR_H + i * ROW_H;
        ctx.fillStyle = i % 2 === 0 ? '#f9f9f9' : '#ffffff';
        ctx.fillRect(0, y, W, ROW_H);
      });

      /* ── vertical month guide lines ── */
      for (const m of PAGE_MONTHS) {
        const x = dayX(m.start);
        ctx.beginPath(); ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 1;
        ctx.moveTo(x, TITLE_H + HDR_H);
        ctx.lineTo(x, TITLE_H + HDR_H + ROWS_H);
        ctx.stroke();
      }

      /* ── Build row index map for dependency drawing ── */
      const rowIndexOnPage = {};
      rows.forEach((r, i) => { rowIndexOnPage[r.id] = i; });

      /* ── Draw title ── */
      drawTitle(ctx, pageDef, pageNum);

      /* ── Draw header ── */
      drawHeader(ctx, PAGE_MONTHS, pageDays, pageDayStart, PX_DAY, ROWS_H, dayX);

      /* ── Draw task rows (bars + labels) first ── */
      rows.forEach((row, i) => drawRow(ctx, row, i, PX_DAY, dateX, dateXe));

      /* ── Draw dependency arrows on top ── */
      drawDependencies(ctx, rows, rowIndexOnPage, ROW_MAP, pageNum, pageDef, dateX, dateXe, PX_DAY, dayX);

      /* ── Borders ── */
      drawBorders(ctx, ROWS_H);

      /* ── Legend ── */
      drawLegend(ctx, TITLE_H + HDR_H + ROWS_H, pageNum);

      /* ── Footer ── */
      drawFooter(ctx, TITLE_H + HDR_H + ROWS_H + LEGEND_H, pageNum);
    }

    /* ── Title ── */
    function drawTitle(ctx, pageDef, pageNum) {
      const g = ctx.createLinearGradient(0, 0, W, TITLE_H);
      g.addColorStop(0, '#1a1a2e'); g.addColorStop(1, '#16213e');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, TITLE_H);

      ctx.font = 'bold 19px Arial'; ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('Resilio', 14, TITLE_H * 0.32);

      ctx.font = '10px Arial'; ctx.fillStyle = '#aaaacc';
      ctx.fillText(
        'Project Gantt Chart  ·  RUP Methodology  ·  Nov 2024 – Apr 2025  ·  58 Tasks  ·  10 Milestones  ·  166 Days',
        90, TITLE_H * 0.32
      );

      /* page indicator */
      ctx.font = 'bold 10px Arial'; ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'right';
      ctx.fillText(pageDef.title, W - 14, TITLE_H * 0.32);

      /* phase chips row */
      const chips = [
        { lb: 'Inception', col: PC.inception },
        { lb: 'Elaboration', col: PC.elaboration },
        { lb: 'Construction', col: PC.construction },
        { lb: 'Transition', col: PC.transition },
      ];
      let cx2 = 14;
      ctx.font = '9.5px Arial'; ctx.textBaseline = 'middle';
      for (const c of chips) {
        ctx.fillStyle = c.col;
        ctx.beginPath(); ctx.roundRect(cx2, TITLE_H * 0.60, 10, 10, 2); ctx.fill();
        ctx.fillStyle = '#ccccdd'; ctx.textAlign = 'left';
        ctx.fillText(c.lb, cx2 + 13, TITLE_H * 0.65);
        cx2 += 13 + ctx.measureText(c.lb).width + 14;
      }
      ctx.fillStyle = '#ccccdd';
      ctx.textAlign = 'left';
      ctx.fillText('◆ Milestone', cx2, TITLE_H * 0.65);
      cx2 += ctx.measureText('◆ Milestone').width + 30;
      ctx.fillStyle = '#aaaacc';
      ctx.fillText('→ Dependency', cx2, TITLE_H * 0.65);
    }

    /* ── Header ── */
    function drawHeader(ctx, PAGE_MONTHS, pageDays, pageDayStart, PX_DAY, ROWS_H, dayX) {
      const y0 = TITLE_H;
      ctx.fillStyle = '#eeeeee';
      ctx.fillRect(0, y0, LABEL_W, HDR_H);
      ctx.font = 'bold 10px Arial'; ctx.fillStyle = '#555555';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText('TASK NAME / ACTIVITY', 10, y0 + HDR_H / 2);

      for (const m of PAGE_MONTHS) {
        const x1 = dayX(m.start);
        const x2 = dayX(m.start + m.days);
        ctx.fillStyle = '#f0f0f0';
        ctx.fillRect(x1, y0, x2 - x1, MHDR_H);
        ctx.strokeStyle = '#d0d0d0'; ctx.lineWidth = 0.5;
        ctx.strokeRect(x1, y0, x2 - x1, MHDR_H);
        ctx.fillStyle = '#333'; ctx.font = 'bold 10px Arial';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(m.name, (x1 + x2) / 2, y0 + MHDR_H / 2);
      }

      /* day number row */
      const y1 = y0 + MHDR_H;
      ctx.fillStyle = '#f8f8f8';
      ctx.fillRect(LABEL_W, y1, CHART_W, DHDR_H);

      // Draw day ticks every 5 days, aligned to month boundaries
      for (const m of PAGE_MONTHS) {
        const mDate = new Date(P_START.getTime() + m.start * 86400000);
        for (let md = 1; md <= m.days; md += 5) {
          const d = m.start + (md - 1);
          if (d < pageDayStart || d > pageDayStart + pageDays) continue;
          const x = dayX(d);
          ctx.beginPath(); ctx.strokeStyle = '#d8d8d8'; ctx.lineWidth = 0.5;
          ctx.moveTo(x, y1); ctx.lineTo(x, TITLE_H + HDR_H + ROWS_H); ctx.stroke();
          ctx.fillStyle = '#888'; ctx.font = '7.5px Arial';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(String(md), x, y1 + DHDR_H / 2);
        }
      }

      ctx.beginPath(); ctx.strokeStyle = '#aaaaaa'; ctx.lineWidth = 1.5;
      ctx.moveTo(0, y0 + HDR_H); ctx.lineTo(W, y0 + HDR_H); ctx.stroke();
    }

    /* ── Row drawing ── */
    function truncateCtx(ctx, text, maxW) {
      if (ctx.measureText(text).width <= maxW) return text;
      let t = text;
      while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
      return t + '…';
    }

    function drawRow(ctx, row, i, PX_DAY, dateX, dateXe) {
      const y = TITLE_H + HDR_H + i * ROW_H;
      const col = PC[row.ph];
      const ind = row.indent * 14 + 8;

      /* separator line */
      ctx.beginPath(); ctx.strokeStyle = '#eeeeee'; ctx.lineWidth = 0.5;
      ctx.moveTo(0, y + ROW_H); ctx.lineTo(W, y + ROW_H); ctx.stroke();

      /* label */
      ctx.save();
      ctx.beginPath(); ctx.rect(2, y + 1, LABEL_W - 6, ROW_H - 2); ctx.clip();

      if (row.t === 'phase') {
        ctx.fillStyle = col + '16'; ctx.fillRect(0, y, LABEL_W, ROW_H);
        ctx.fillStyle = col; ctx.fillRect(0, y, 5, ROW_H);
        ctx.font = 'bold 11px Arial'; ctx.fillStyle = col;
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(row.lb, 10, y + ROW_H / 2);
      } else if (row.t === 'group') {
        ctx.font = 'bold 9.5px Arial'; ctx.fillStyle = '#222';
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(truncateCtx(ctx, row.lb, LABEL_W - ind - 4), ind, y + ROW_H / 2);
      } else if (row.t === 'task') {
        ctx.font = '9px Arial'; ctx.fillStyle = '#444';
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(truncateCtx(ctx, row.lb, LABEL_W - ind - 4), ind, y + ROW_H / 2);
      } else if (row.t === 'mile') {
        ctx.font = 'bold 9px Arial'; ctx.fillStyle = col;
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillText(truncateCtx(ctx, '◆ ' + row.lb, LABEL_W - ind - 4), ind, y + ROW_H / 2);
      }
      ctx.restore();

      /* bar / marker */
      if (row.t === 'phase') {
        const bx = dateX(row.s), bw = Math.max(dateXe(row.e) - dateX(row.s), 4);
        const bh = ROW_H - 10, by = y + 5;
        ctx.fillStyle = col + '1e';
        ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 3); ctx.fill();
        ctx.strokeStyle = col + '55'; ctx.lineWidth = 1; ctx.stroke();
      } else if (row.t === 'group') {
        const bx = dateX(row.s), bw = Math.max(dateXe(row.e) - dateX(row.s), 4);
        const bh = 12, by = y + (ROW_H - bh) / 2;
        ctx.fillStyle = col + 'cc';
        ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 3); ctx.fill();
      } else if (row.t === 'task') {
        const bx = dateX(row.s), bw = Math.max(dateXe(row.e) - dateX(row.s), 5);
        const bh = 10, by = y + (ROW_H - bh) / 2;
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 2); ctx.fill();
      } else if (row.t === 'mile') {
        const mx = dateX(row.d) + PX_DAY * 0.5;
        const my = y + ROW_H / 2;
        const ms = 7;
        ctx.save();
        ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.strokeStyle = col + '55'; ctx.lineWidth = 1;
        ctx.moveTo(mx, TITLE_H + HDR_H); ctx.lineTo(mx, my - ms);
        ctx.stroke(); ctx.restore();
        ctx.beginPath();
        ctx.moveTo(mx, my - ms);
        ctx.lineTo(mx + ms, my);
        ctx.lineTo(mx, my + ms);
        ctx.lineTo(mx - ms, my);
        ctx.closePath();
        ctx.fillStyle = col; ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
      }
    }

    /* ── Dependency arrows ── */
    function getBarRight(row, dateXe, PX_DAY) {
      if (row.t === 'mile') return dateXe(row.d) + PX_DAY * 0.5 + 7;
      if (row.s) return Math.max(dateXe(row.e), dateXe(row.s) + 5);
      return 0;
    }
    function getBarLeft(row, dateX) {
      if (row.t === 'mile') return dateX(row.d);
      if (row.s) return dateX(row.s);
      return 0;
    }
    function rowMidY(i) {
      return TITLE_H + HDR_H + i * ROW_H + ROW_H / 2;
    }

    function drawDependencies(ctx, rows, rowIndexOnPage, ROW_MAP, pageNum, pageDef, dateX, dateXe, PX_DAY, dayX) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(LABEL_W + 1, TITLE_H + HDR_H, CHART_W - 1, rows.length * ROW_H);
      ctx.clip();

      const AH = 5;   // arrowhead size
      const GAP = 8;   // px gap after bar before turning corner

      rows.forEach((row, toIdx) => {
        if (!row.deps) return;

        row.deps.forEach(depId => {
          const fromRow = ROW_MAP[depId];
          if (!fromRow) return;

          /* ── Source point: right edge of predecessor bar ── */
          let fromX;
          if (fromRow.t === 'mile') fromX = dayX(daysSince(fromRow.d)) + PX_DAY * 0.5 + 7;
          else if (fromRow.e) fromX = dateXe(fromRow.e);
          else return;

          const fromIdx = rowIndexOnPage[depId];
          const fromY = (fromIdx !== undefined)
            ? TITLE_H + HDR_H + fromIdx * ROW_H + ROW_H / 2
            : TITLE_H + HDR_H + 4;   // comes from previous page — enter from top

          /* ── Target point: left edge of successor bar ── */
          let toX;
          if (row.t === 'mile') toX = dayX(daysSince(row.d)) + PX_DAY * 0.5;
          else if (row.s) toX = dateX(row.s);
          else return;
          const toY = TITLE_H + HDR_H + toIdx * ROW_H + ROW_H / 2;

          // Skip invisible
          if (toX < LABEL_W || fromX < LABEL_W) return;
          if (Math.abs(fromX - toX) < 1 && Math.abs(fromY - toY) < 1) return;

          const col = PC[fromRow.ph] || '#555';
          ctx.save();
          ctx.setLineDash([]);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.lineWidth = 1.4;
          ctx.strokeStyle = col + 'dd';
          ctx.fillStyle = col + 'dd';

          /* ── Route: FS (Finish-to-Start) elbow ── */
          const elbowX = fromX + GAP;
          ctx.beginPath();
          ctx.moveTo(fromX, fromY);

          if (Math.abs(fromY - toY) < 1) {
            // Same row — direct horizontal line
            ctx.lineTo(toX - AH, toY);
          } else if (toX > elbowX + 2) {
            // Target is to the right — simple Γ shape
            ctx.lineTo(elbowX, fromY);
            ctx.lineTo(elbowX, toY);
            ctx.lineTo(toX - AH, toY);
          } else {
            // Target is to the left or overlapping — Z detour
            const detourX = Math.max(fromX, toX) + GAP * 2;
            ctx.lineTo(detourX, fromY);
            ctx.lineTo(detourX, toY);
            ctx.lineTo(toX - AH, toY);
          }
          ctx.stroke();

          /* ── Arrowhead ── */
          ctx.beginPath();
          ctx.moveTo(toX, toY);
          ctx.lineTo(toX - AH, toY - AH * 0.55);
          ctx.lineTo(toX - AH, toY + AH * 0.55);
          ctx.closePath();
          ctx.fill();

          ctx.restore();
        });
      });

      ctx.restore();
    }



    /* ── Borders ── */
    function drawBorders(ctx, ROWS_H) {
      ctx.beginPath(); ctx.strokeStyle = '#aaaaaa'; ctx.lineWidth = 1.5;
      ctx.moveTo(LABEL_W, TITLE_H); ctx.lineTo(LABEL_W, TITLE_H + HDR_H + ROWS_H);
      ctx.stroke();
      ctx.beginPath(); ctx.strokeStyle = '#999999'; ctx.lineWidth = 1;
      ctx.strokeRect(0, TITLE_H, W, HDR_H + ROWS_H);
    }

    /* ── Legend ── */
    function drawLegend(ctx, y0, pageNum) {
      ctx.fillStyle = '#f5f5f5';
      ctx.fillRect(0, y0, W, LEGEND_H);
      ctx.beginPath(); ctx.strokeStyle = '#cccccc'; ctx.lineWidth = 1;
      ctx.moveTo(0, y0); ctx.lineTo(W, y0); ctx.stroke();

      const items = [
        { lb: 'Inception (Nov 2024)', col: PC.inception },
        { lb: 'Elaboration (Dec 2024)', col: PC.elaboration },
        { lb: 'Construction (Jan – Mar 2025)', col: PC.construction },
        { lb: 'Transition (Mar – Apr 2025)', col: PC.transition },
      ];
      let lx = 18;
      const ly = y0 + LEGEND_H / 2;
      ctx.textBaseline = 'middle';

      for (const it of items) {
        ctx.fillStyle = it.col;
        ctx.beginPath(); ctx.roundRect(lx, ly - 6, 13, 13, 2); ctx.fill();
        ctx.fillStyle = '#333'; ctx.font = '9.5px Arial';
        ctx.textAlign = 'left';
        ctx.fillText(it.lb, lx + 17, ly);
        lx += 17 + ctx.measureText(it.lb).width + 20;
      }

      /* milestone diamond */
      const ms = 6;
      ctx.beginPath();
      ctx.moveTo(lx + ms, ly - ms); ctx.lineTo(lx + ms * 2, ly);
      ctx.lineTo(lx + ms, ly + ms); ctx.lineTo(lx, ly);
      ctx.closePath(); ctx.fillStyle = '#666'; ctx.fill();
      ctx.fillStyle = '#333'; ctx.font = '9.5px Arial';
      ctx.textAlign = 'left';
      ctx.fillText('Milestone', lx + ms * 2 + 6, ly);
      lx += ms * 2 + 6 + ctx.measureText('Milestone').width + 20;

      /* dependency arrow */
      ctx.strokeStyle = '#888'; ctx.lineWidth = 1.3; ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + 22, ly); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#888';
      ctx.beginPath();
      ctx.moveTo(lx + 16, ly - 4); ctx.lineTo(lx + 22, ly); ctx.lineTo(lx + 16, ly + 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#333'; ctx.font = '9.5px Arial';
      ctx.textAlign = 'left';
      ctx.fillText('Dependency', lx + 27, ly);
    }

    /* ── Footer ── */
    function drawFooter(ctx, y0, pageNum) {
      ctx.fillStyle = '#ececec';
      ctx.fillRect(0, y0, W, FOOTER_H);
      ctx.beginPath(); ctx.strokeStyle = '#cccccc'; ctx.lineWidth = 1;
      ctx.moveTo(0, y0); ctx.lineTo(W, y0); ctx.stroke();

      ctx.fillStyle = '#888'; ctx.font = '9px Arial'; ctx.textBaseline = 'middle';
      ctx.textAlign = 'left';
      ctx.fillText('Milan Shrestha  |  23057135  |  Islington College / London Metropolitan University', 16, y0 + FOOTER_H / 2);
      ctx.textAlign = 'right';
      ctx.fillText(`Page ${pageNum} of 3`, W - 16, y0 + FOOTER_H / 2);
    }

    /* ── Render all pages ── */
    PAGE_DEFS.forEach((pd, i) => {
      renderPage('c' + i, pd, i + 1);
    });

    /* ── Download helpers ── */
    function dlPage(i) {
      const cv = document.getElementById('c' + i);
      const a = document.createElement('a');
      a.download = `resilio-gantt-page${i + 1}.png`;
      a.href = cv.toDataURL('image/png');
      a.click();
    }

    function dlAll() {
      for (let i = 0; i < 3; i++) {
        setTimeout(() => dlPage(i), i * 400);
      }
    }
  </script>
</body>
